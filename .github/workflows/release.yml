name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build APK
        run: ./gradlew :androidApp:assembleDebug
      - name: Rename APK
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk portfolio-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: portfolio-android.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build iOS app for Simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip .app
        run: |
          cd build/ios/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/portfolio-ios-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: portfolio-ios-simulator.zip

  release:
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/portfolio-android.apk \
            artifacts/portfolio-ios-simulator.zip \
            --repo "${{ github.repository }}" \
            --title "Portfolio ${{ github.ref_name }}" \
            --generate-notes